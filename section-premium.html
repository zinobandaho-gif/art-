<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Riwaq</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{luxury:{gold:'#B7791F',goldLight:'#F3D9A4',ink:'#29241E',sage:'#597C65',sageDark:'#385442',sageLight:'#E5EFE7',border:'#E5D7C2'}},fontFamily:{serif:['Playfair Display','serif'],sans:['Plus Jakarta Sans','sans-serif']}}}}</script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;color:#29241E;font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(ellipse at 12% 5%,rgba(183,121,31,.14),transparent 35%),radial-gradient(ellipse at 88% 82%,rgba(89,124,101,.16),transparent 38%),#FFFDF8}.glass{background:#fffdf8e8;backdrop-filter:blur(16px);border-bottom:1px solid #e5d7c2}.card{background:#fff;border:1px solid #E5D7C2;box-shadow:0 12px 32px #543a1914;transition:.3s}.card:hover{transform:translateY(-6px);border-color:#B7791F;box-shadow:0 22px 38px #543a1924}.eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:.7rem;font-weight:700;color:#597C65}.auction{background:linear-gradient(135deg,#274234,#597C65)}.bid+.bid{border-top:1px solid #eee5d8}.filter.active{background:#597C65;color:#fff;border-color:#597C65}.artist{position:relative;overflow:hidden}.artist:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;right:-50px;bottom:-75px;background:#597c6517;transition:.35s}.artist:hover:after{transform:scale(1.45)}dialog{border:0;border-radius:24px;padding:0;max-width:min(92vw,680px)}dialog::backdrop{background:#29241e75;backdrop-filter:blur(4px)}</style></head><body>
<header class="glass sticky top-0 z-30"><div class="max-w-7xl mx-auto px-5 h-20 flex items-center justify-between"><a href="index-centered.html" class="font-serif text-2xl font-bold"><span class="text-luxury-gold">Al</span>Riwaq <small class="font-sans text-[10px] tracking-[.2em] text-luxury-sage">· ART</small></a><nav class="flex gap-4 items-center text-sm"><a href="section-premium.html?section=artists" class="hidden sm:block hover:text-luxury-sage">Artists</a><a href="auction-ultimate.html" class="hidden sm:block hover:text-luxury-sage">Auction</a><a href="index-centered.html" class="font-semibold text-luxury-sage"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Home</a></nav></div></header>
<main class="max-w-7xl mx-auto px-5 py-14 md:py-20"><section class="text-center max-w-3xl mx-auto mb-14"><p class="eyebrow" id="label"></p><h1 class="font-serif font-bold text-5xl md:text-7xl mt-4" id="title"></h1><p class="text-[#6F665C] leading-8 mt-5 text-lg" id="intro"></p></section><div id="app"></div></main><footer class="border-t border-luxury-border py-8 text-center text-sm text-[#6F665C]">© 2026 Al-Riwaq Art Gallery · Curated with care.</footer><dialog id="modal"><div id="modalBody"></div></dialog>
<script>
const route=new URLSearchParams(location.search).get('section')||'traditional',app=document.querySelector('#app'),modal=document.querySelector('#modal'),$=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-US').format(n)+' DZD';
const works=[['Echo of the Eternal Horizon','Omar Al-Abdali','Traditional',145000,'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&q=80&w=1000'],['Symphony of Silent Colors','Layla Bin Saleh','Traditional',89000,'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=1000'],['Harbors of Forgotten Souls','Nour El-Din','Traditional',120000,'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&q=80&w=1000'],['Dance of Butterflies','Sara Al-Ahmad','Traditional',76000,'https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&q=80&w=1000'],['Architecture of Digital Consciousness','Sami King','Digital',210000,'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=1000'],['City of Light','Khalid Al-Fahd','Digital',320000,'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&q=80&w=1000']];
const people=[['Omar Al-Abdali','Algiers, Algeria','Oil & mixed media','Painting',11,11,'I paint places that stay with us long after we leave them.','Omar builds quiet landscapes from remembered desert journeys and the geometry of old towns.',0],['Layla Bin Saleh','Riyadh, Saudi Arabia','Abstract painting','Painting',8,5,'Color is my way of turning a feeling into a place.','Layla uses gesture and color to build a visual language of memory and belonging.',1],['Nour El-Din','Cairo, Egypt','Contemporary oil','Painting',14,8,'Every painting begins with a question about belonging.','Nour’s imagined coastlines carry stories of travel and return.',2],['Sara Al-Ahmad','Amman, Jordan','Watercolor & ink','Paper',7,7,'I am drawn to the details that most people pass by.','Sara captures movement in nature through delicate studies of light.',3],['Sami King','London, UK','Digital & generative','Digital',19,1,'I use code as a material, just as others use paint.','Sami composes immersive digital environments where architecture and emotion meet.',4],['Khalid Al-Fahd','Dubai, UAE','New media','Digital',12,3,'Light lets a city reveal its hidden character.','Khalid studies the energy of cities after dark through luminous forms.',5]];
function head(t,i,l){$('#title').textContent=t;$('#intro').textContent=i;$('#label').textContent=l;document.title='Al-Riwaq — '+t}function show(h){$('#modalBody').innerHTML=h;modal.showModal();$('[data-close]').onclick=()=>modal.close()}function workCard(x){return `<article class="card rounded-2xl overflow-hidden"><img src="${x[4]}" class="w-full aspect-[4/5] object-cover"><div class="p-5"><p class="eyebrow">${x[2]}</p><h2 class="font-serif text-2xl font-bold mt-2">${x[0]}</h2><p class="text-[#6F665C] text-sm mt-2">by ${x[1]}</p><div class="flex justify-between items-center mt-5"><b class="text-luxury-sage">${money(x[3])}</b><button class="text-luxury-sage font-bold text-sm" data-work="${x[0]}">Enquire</button></div></div></article>`}function gallery(type){head(type+' Artworks',type==='Traditional'?'Paintings with history, texture, and a human hand in every brushstroke.':'Bold contemporary works where code, color, and imagination meet.','Al-Riwaq collection');app.innerHTML='<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-7">'+works.filter(x=>x[2]===type).map(workCard).join('')+'</div>'}
function artists(){head('Our Artists','Meet independent artists with distinctive perspectives, honest craft, and stories worth collecting.','The Al-Riwaq collective');let current=[...people];app.innerHTML=`<section class="rounded-3xl bg-luxury-sageLight p-7 md:p-10 mb-10"><div class="grid md:grid-cols-[1.4fr_1fr] gap-8 items-end"><div><p class="eyebrow">Featured voices</p><h2 class="font-serif text-4xl md:text-5xl font-bold mt-3">Art begins with a human story.</h2><p class="text-[#6F665C] mt-4 leading-7">Explore the people behind the work: their cities, influences, studio rituals, and evolving collections.</p></div><div class="bg-white/80 rounded-2xl p-5"><b class="text-luxury-sage">This season</b><p class="font-serif text-3xl font-bold mt-2">6 represented artists</p><p class="text-[#6F665C] text-sm mt-2">Across North Africa, the Middle East, and Europe.</p></div></div></section><section class="flex flex-col lg:flex-row justify-between gap-5 mb-7"><div id="filters" class="flex flex-wrap gap-2">${['All','Painting','Paper','Digital'].map(x=>`<button class="filter border border-luxury-border px-4 py-2 rounded-full text-sm ${x==='All'?'active':''}" data-filter="${x}">${x==='Paper'?'Works on paper':x}</button>`).join('')}</div><input id="search" class="border border-luxury-border rounded-full py-2.5 px-4 text-sm bg-white focus:outline-luxury-sage" placeholder="Search an artist"></section><p id="count" class="text-[#6F665C] text-sm mb-5"></p><div id="people" class="grid md:grid-cols-2 lg:grid-cols-3 gap-7"></div><section class="mt-16 card rounded-3xl p-8 md:p-10"><p class="eyebrow">Studio notes</p><div class="grid md:grid-cols-3 gap-7 mt-5">${people.slice(0,3).map(p=>`<blockquote class="border-l-2 border-luxury-gold pl-5"><p class="font-serif text-xl leading-8">“${p[6]}”</p><footer class="mt-3 text-sm text-luxury-sage font-bold">— ${p[0]}</footer></blockquote>`).join('')}</div></section>`;const draw=()=>{$('#people').innerHTML=current.map((p,i)=>`<article class="artist card rounded-2xl p-7"><div class="relative z-10 flex gap-4 items-center"><img class="w-20 h-20 rounded-full object-cover border-4 border-luxury-sageLight" src="https://i.pravatar.cc/240?img=${p[5]}"><div><h2 class="font-serif text-2xl font-bold">${p[0]}</h2><p class="text-luxury-sage text-sm font-semibold mt-1">${p[2]}</p><p class="text-[#887D70] text-xs mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${p[1]}</p></div></div><p class="relative z-10 text-[#6F665C] leading-7 text-sm mt-6">${p[6]}</p><div class="relative z-10 flex justify-between mt-5 pt-5 border-t border-luxury-border"><span><b class="text-luxury-sage text-lg">${p[4]}</b> <small>artworks</small></span><button class="text-luxury-sage font-bold text-sm" data-person="${i}">View profile <i class="fa-solid fa-arrow-right ml-1"></i></button></div></article>`).join('');$('#count').textContent=current.length+' artists shown';document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>profile(current[+b.dataset.person]))};draw();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.filter==='All'?[...people]:people.filter(p=>p[3]===b.dataset.filter);draw()});$('#search').oninput=e=>{let q=e.target.value.toLowerCase();current=people.filter(p=>(p[0]+p[1]+p[2]).toLowerCase().includes(q));draw()}}
function profile(p){show(`<div class="grid md:grid-cols-2"><img src="${works[p[8]][4]}" class="w-full h-full min-h-[280px] object-cover"><div class="p-8"><button data-close class="float-right text-[#887D70]">✕</button><p class="eyebrow">${p[2]}</p><h2 class="font-serif text-4xl font-bold mt-2">${p[0]}</h2><p class="text-luxury-sage font-semibold mt-2"><i class="fa-solid fa-location-dot mr-1"></i>${p[1]}</p><p class="text-[#6F665C] leading-7 mt-6">${p[7]}</p><div class="mt-6 p-4 rounded-xl bg-luxury-sageLight"><b class="text-luxury-sage">${p[4]} artworks</b> represented by Al-Riwaq.</div><button class="mt-6 w-full bg-luxury-gold rounded-full py-3 font-bold">Explore collection</button></div></div>`)}
function auction(){head('Live Auction','A transparent, high-touch auction experience for remarkable works and serious collectors.','Live at Al-Riwaq');let lot=0,bids=[];const lots=[works[0],works[2],works[4]];const reset=()=>bids=[['Amira B.',lots[lot][3],'just now'],['Youssef K.',lots[lot][3]-7000,'2 min ago'],['Lina M.',lots[lot][3]-13000,'5 min ago']];reset();const render=()=>{let a=lots[lot];app.innerHTML=`<section class="auction rounded-3xl p-7 md:p-12 text-white overflow-hidden relative"><div class="absolute -right-24 -top-20 w-72 h-72 bg-luxury-gold/20 rounded-full blur-3xl"></div><div class="relative grid lg:grid-cols-2 gap-10 items-center"><div><p class="text-luxury-goldLight text-xs tracking-[.22em] font-bold uppercase"><span class="inline-block w-2 h-2 bg-red-400 rounded-full animate-pulse mr-2"></span>Lot ${String(lot+1).padStart(2,'0')} · Live now</p><h2 class="font-serif text-4xl md:text-6xl font-bold mt-4">${a[0]}</h2><p class="text-white/75 mt-4">${a[1]} · ${a[2]} · Authenticated by Al-Riwaq</p><div id="timer" class="grid grid-cols-3 gap-3 max-w-sm mt-7"></div><p class="text-white/60 text-xs uppercase tracking-wider mt-8">Current bid</p><p class="font-serif text-5xl font-bold text-luxury-goldLight mt-1">${money(bids[0][1])}</p><p class="text-white/65 text-sm mt-1">${bids.length+9} collectors have placed a bid</p><div class="flex gap-3 mt-7"><button id="bid" class="bg-luxury-gold text-luxury-ink px-7 py-4 rounded-full font-bold">Place next bid <i class="fa-solid fa-gavel ml-2"></i></button><button id="watch" class="border border-white/30 px-5 py-4 rounded-full"><i class="fa-regular fa-heart"></i> Watch</button></div></div><div class="bg-white/10 rounded-2xl border border-white/15 overflow-hidden"><img src="${a[4]}" class="w-full aspect-[4/3] object-cover"><div class="p-5 flex justify-between"><span class="text-white/70">Estimate</span><b>${money(a[3])} – ${money(a[3]+70000)}</b></div></div></div></section><section class="grid lg:grid-cols-3 gap-7 mt-8"><article class="card rounded-2xl p-6 lg:col-span-2"><p class="eyebrow">Live activity</p><h2 class="font-serif text-3xl font-bold mt-2">Bid history</h2><div class="mt-5">${bids.map(b=>`<div class="bid py-4 flex justify-between items-center"><span><b>${b[0]}</b><small class="block text-[#887D70]">${b[2]}</small></span><b class="text-luxury-sage">${money(b[1])}</b></div>`).join('')}</div></article><aside class="card rounded-2xl p-6"><p class="eyebrow">Auction promise</p><h2 class="font-serif text-3xl font-bold mt-2">Collect with confidence</h2><p class="text-[#6F665C] text-sm leading-7 mt-4">Every lot is reviewed for authenticity, provenance, and condition. Winning collectors receive white-glove support.</p></aside></section><section class="mt-14"><div class="flex justify-between items-end mb-6"><div><p class="eyebrow">Coming next</p><h2 class="font-serif text-4xl font-bold mt-2">Upcoming lots</h2></div><small class="text-[#6F665C]">Select a lot to preview</small></div><div class="grid md:grid-cols-3 gap-6">${lots.map((x,i)=>`<button data-lot="${i}" class="card rounded-2xl overflow-hidden text-left ${i===lot?'ring-2 ring-luxury-gold':''}"><img src="${x[4]}" class="w-full aspect-[16/10] object-cover"><div class="p-5"><p class="eyebrow">Lot ${String(i+1).padStart(2,'0')}</p><h3 class="font-serif text-xl font-bold mt-2">${x[0]}</h3><p class="text-[#6F665C] text-sm mt-1">${x[1]}</p></div></button>`).join('')}</div></section>`;document.querySelectorAll('[data-lot]').forEach(b=>b.onclick=()=>{lot=+b.dataset.lot;reset();render()});$('#bid').onclick=()=>{bids.unshift(['You',bids[0][1]+5000,'just now']);render()};$('#watch').onclick=e=>{e.currentTarget.innerHTML='<i class="fa-solid fa-heart text-luxury-gold"></i> Watching'};clock()};render()}
function clock(){let end=Date.now()+9900000;setInterval(()=>{let n=Math.max(0,end-Date.now()),v=[[Math.floor(n/3600000),'HRS'],[Math.floor(n/60000)%60,'MIN'],[Math.floor(n/1000)%60,'SEC']];let e=$('#timer');if(e)e.innerHTML=v.map(x=>`<div class="bg-white/10 border border-white/15 rounded-xl p-3 text-center"><b class="text-2xl">${String(x[0]).padStart(2,'0')}</b><small class="block text-white/60">${x[1]}</small></div>`).join('')},1000)}
if(route==='artists')artists();else if(route==='auction')auction();else gallery(route==='digital'?'Digital':'Traditional');
</script></body></html>
