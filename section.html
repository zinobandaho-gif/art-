<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Riwaq — Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { luxury: { gold:'#B7791F', goldLight:'#F3D9A4', dark:'#FFFDF8', card:'#FFFFFF', border:'#E5D7C2', ink:'#29241E', sage:'#597C65', sageLight:'#E5EFE7' } }, fontFamily: { serif:['Playfair Display','serif'], sans:['Plus Jakarta Sans','sans-serif'] } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Plus Jakarta Sans',sans-serif; color:#29241E; background:radial-gradient(ellipse at 12% 5%,rgba(183,121,31,.14),transparent 35%),radial-gradient(ellipse at 88% 82%,rgba(89,124,101,.18),transparent 36%),#FFFDF8; }
    .glass { background:rgba(255,253,248,.88); backdrop-filter:blur(18px); border-bottom:1px solid rgba(135,84,23,.15); }
    .card { background:#fff; border:1px solid #E5D7C2; box-shadow:0 12px 32px rgba(84,58,25,.08); transition:.3s ease; }
    .card:hover { transform:translateY(-7px); box-shadow:0 22px 38px rgba(84,58,25,.14); border-color:#B7791F; }
    .eyebrow { letter-spacing:.22em; text-transform:uppercase; font-size:.72rem; font-weight:700; color:#597C65; }
    .auction-hero { background:linear-gradient(135deg,#385442,#597C65); box-shadow:0 22px 45px rgba(56,84,66,.22); }
    .timer-box { background:rgba(255,255,255,.1); border:1px solid rgba(243,217,164,.35); min-width:76px; }
    .bid-row + .bid-row { border-top:1px solid #EDE4D6; }
    .artist-card { position:relative; overflow:hidden; }
    .artist-card::after { content:''; position:absolute; inset:auto -25% -55% auto; width:150px; height:150px; background:rgba(89,124,101,.10); border-radius:50%; transition:.35s ease; }
    .artist-card:hover::after { transform:scale(1.4); }
  </style>
</head>
<body>
  <header class="glass sticky top-0 z-20">
    <div class="max-w-7xl mx-auto h-20 px-5 flex items-center justify-between">
      <a href="index%20(1).html" class="font-serif text-2xl font-bold"><span class="text-luxury-gold">Al</span>Riwaq <span class="font-sans text-xs font-normal tracking-[.2em] text-luxury-sage">· ART</span></a>
      <a href="index%20(1).html" class="text-sm font-semibold text-luxury-sage hover:text-luxury-gold transition"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Home</a>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-5 py-16 md:py-24">
    <section class="text-center max-w-3xl mx-auto mb-16">
      <p class="eyebrow" id="eyebrow">Al-Riwaq Collection</p>
      <h1 class="font-serif font-bold text-5xl md:text-7xl mt-4" id="title"></h1>
      <p class="text-[#6F665C] leading-8 mt-6 text-lg" id="description"></p>
    </section>
    <section id="content"></section>
  </main>
  <footer class="border-t border-luxury-border bg-white/50 py-8 text-center text-sm text-[#6F665C]">© 2026 Al-Riwaq Art Gallery · Curated with care.</footer>
  <script>
    const section = new URLSearchParams(location.search).get('section') || 'traditional';
    const art = [
      ['Echo of the Eternal Horizon','Omar Al-Abdali','Traditional','https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&q=80&w=900'],
      ['Symphony of Silent Colors','Layla Bin Saleh','Traditional','https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&q=80&w=900'],
      ['Harbors of Forgotten Souls','Nour El-Din','Traditional','https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&q=80&w=900'],
      ['Dance of Butterflies','Sara Al-Ahmad','Traditional','https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?auto=format&fit=crop&q=80&w=900'],
      ['Architecture of Digital Consciousness','Sami King','Digital','https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=900'],
      ['City of Light','Khalid Al-Fahd','Digital','https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&q=80&w=900'],
      ['Neon Dreams','Zara Tech','Digital','https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=900'],
      ['Pixel Paradise','Alex Byte','Digital','https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&q=80&w=900']
    ];
    const details = {
      traditional:['Traditional Artworks','Paintings with history, texture, and a human hand in every brushstroke.'],
      digital:['Digital Artworks','Bold contemporary works where code, color, and imagination meet.'],
      artists:['Our Artists','Meet the independent creators shaping the Al-Riwaq collection.'],
      auction:['Live Auction','Exceptional pieces selected for the next Al-Riwaq auction.']
    };
    const [title, description] = details[section] || details.traditional;
    document.title = `Al-Riwaq — ${title}`; document.getElementById('title').textContent = title; document.getElementById('description').textContent = description;
    const content = document.getElementById('content');
    const card = ([name, artist, type, image]) => `<article class="card rounded-2xl overflow-hidden"><img src="${image}" alt="${name}" class="w-full aspect-[4/5] object-cover"><div class="p-5"><p class="eyebrow">${type}</p><h2 class="font-serif text-2xl font-bold mt-2">${name}</h2><p class="text-[#6F665C] text-sm mt-2">by ${artist}</p><button class="mt-5 text-luxury-sage font-bold text-sm">View artwork <i class="fa-solid fa-arrow-right ml-1"></i></button></div></article>`;
    if (section === 'artists') {
      const profiles = [
        ['Omar Al-Abdali','Algiers, Algeria','Oil & mixed media','Inspired by the quiet geometry of desert horizons.',11,11,'I paint places that stay with us long after we leave them.'],
        ['Layla Bin Saleh','Riyadh, Saudi Arabia','Abstract painting','Exploring memory through layered, expressive color.',8,5,'Color is my way of turning a feeling into a place.'],
        ['Nour El-Din','Cairo, Egypt','Contemporary oil','Stories of coastlines, travel, and imagined harbors.',14,8,'Every painting begins with a question about belonging.'],
        ['Sara Al-Ahmad','Amman, Jordan','Watercolor & ink','Delicate studies of movement, nature, and light.',7,7,'I am drawn to the details that most people pass by.'],
        ['Sami King','London, UK','Digital & generative','Digital worlds built from architecture and emotion.',19,1,'I use code as a material, just as others use paint.'],
        ['Khalid Al-Fahd','Dubai, UAE','New media','A luminous view of cities after dark.',12,3,'Light lets a city reveal its hidden character.']
      ];
      const profileCard = (p, i) => `<article class="artist-card card rounded-2xl p-7"><div class="relative z-10 flex items-start gap-4"><img class="w-20 h-20 rounded-full object-cover border-4 border-luxury-sageLight" src="https://i.pravatar.cc/240?img=${p[5]}" alt="${p[0]}"><div><h2 class="font-serif text-2xl font-bold">${p[0]}</h2><p class="text-luxury-sage text-sm font-semibold mt-1">${p[2]}</p><p class="text-[#887D70] text-xs mt-1"><i class="fa-solid fa-location-dot mr-1"></i>${p[1]}</p></div></div><p class="relative z-10 text-[#6F665C] leading-7 text-sm mt-6">${p[3]}</p><div class="relative z-10 flex items-center justify-between mt-6 pt-5 border-t border-luxury-border"><span class="text-sm"><b class="text-luxury-sage text-lg">${p[4]}</b> artworks</span><button class="open-profile text-luxury-sage font-bold text-sm" data-index="${i}">View profile <i class="fa-solid fa-arrow-right ml-1"></i></button></div></article>`;
      content.innerHTML = `<section class="rounded-3xl bg-luxury-sageLight p-7 md:p-10 mb-12"><div class="flex flex-col md:flex-row md:items-end md:justify-between gap-5"><div><p class="eyebrow">Featured artists</p><h2 class="font-serif text-4xl font-bold mt-2">Artists to know now</h2><p class="text-[#6F665C] mt-3 max-w-2xl">Independent voices selected for their distinctive point of view and honest craft.</p></div><span class="text-luxury-sage font-bold text-sm">Meet the makers <i class="fa-solid fa-arrow-right ml-1"></i></span></div><div class="grid sm:grid-cols-3 gap-5 mt-8">${profiles.slice(0,3).map((p,i)=>`<button class="open-profile bg-white/80 text-left rounded-2xl p-5 hover:bg-white transition" data-index="${i}"><p class="text-luxury-sage text-xs font-bold uppercase tracking-wider">Featured</p><h3 class="font-serif text-2xl font-bold mt-2">${p[0]}</h3><p class="text-[#6F665C] text-sm mt-1">${p[2]}</p></button>`).join('')}</div></section><section><div class="flex items-end justify-between mb-6"><div><p class="eyebrow">The collective</p><h2 class="font-serif text-4xl font-bold mt-2">Our artists</h2></div><span class="text-[#6F665C] text-sm">${profiles.length} represented artists</span></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7">${profiles.map(profileCard).join('')}</div></section><dialog id="artistDialog" class="backdrop:bg-[#29241E]/35 rounded-3xl border border-luxury-border p-0 w-[min(92vw,600px)]"><div id="dialogBody"></div></dialog>`;
      const dialog = document.getElementById('artistDialog');
      document.querySelectorAll('.open-profile').forEach(button => button.addEventListener('click', () => { const p = profiles[button.dataset.index]; document.getElementById('dialogBody').innerHTML = `<div class="p-8 md:p-10"><button id="closeDialog" class="float-right text-[#887D70] hover:text-luxury-sage"><i class="fa-solid fa-xmark text-xl"></i></button><img class="w-28 h-28 rounded-full object-cover border-4 border-luxury-sageLight" src="https://i.pravatar.cc/240?img=${p[5]}" alt="${p[0]}"><p class="eyebrow mt-6">${p[2]}</p><h2 class="font-serif text-4xl font-bold mt-2">${p[0]}</h2><p class="text-luxury-sage font-semibold mt-2"><i class="fa-solid fa-location-dot mr-1"></i>${p[1]}</p><p class="text-[#6F665C] leading-8 mt-6">${p[6]}</p><div class="mt-7 p-4 bg-luxury-sageLight rounded-xl text-sm"><b class="text-luxury-sage">${p[4]} artworks</b> currently represented by Al-Riwaq.</div><button class="mt-7 w-full bg-luxury-gold text-luxury-ink py-3 rounded-full font-bold">Explore ${p[0].split(' ')[0]}'s artworks</button></div>`; dialog.showModal(); document.getElementById('closeDialog').onclick = () => dialog.close(); }));
    } else if (section === 'auction') {
      content.innerHTML = `
        <div class="auction-hero rounded-3xl p-7 md:p-12 mb-12 text-white overflow-hidden relative">
          <div class="absolute -right-20 -top-20 w-64 h-64 bg-luxury-gold/20 rounded-full blur-3xl"></div>
          <div class="relative grid lg:grid-cols-2 gap-10 items-center">
            <div><p class="eyebrow !text-luxury-goldLight"><i class="fa-solid fa-circle text-[8px] mr-2 animate-pulse"></i>Live now</p><h2 class="font-serif text-4xl md:text-6xl font-bold mt-4">The Collector's Evening</h2><p class="mt-5 text-white/75 leading-7">A rare work chosen for discerning collectors. Every bid is live, transparent, and part of the story.</p><div class="flex flex-wrap gap-3 mt-8" id="auctionTimer"></div><button class="mt-8 bg-luxury-gold px-8 py-4 rounded-full text-luxury-ink font-bold hover:scale-105 transition" onclick="this.textContent='Bid registered ✓'">Place a bid <i class="fa-solid fa-gavel ml-2"></i></button></div>
            <div class="bg-white/10 border border-white/15 rounded-2xl overflow-hidden"><img src="${art[0][3]}" alt="${art[0][0]}" class="w-full aspect-[4/3] object-cover"><div class="p-6"><p class="text-luxury-goldLight text-xs uppercase tracking-[.2em] font-bold">Featured lot · #01</p><h3 class="font-serif text-3xl font-bold mt-2">${art[0][0]}</h3><div class="flex items-end justify-between mt-5"><div><p class="text-white/60 text-xs uppercase tracking-wider">Current bid</p><p class="text-3xl font-bold text-luxury-goldLight">145,000 DZD</p></div><span class="bg-red-400/20 text-red-100 px-3 py-1 rounded-full text-xs font-bold">12 bids</span></div></div></div>
          </div>
        </div>
        <div class="grid lg:grid-cols-3 gap-7 mb-14"><section class="card rounded-2xl p-6 lg:col-span-1"><p class="eyebrow">Bid activity</p><h2 class="font-serif text-3xl font-bold mt-2 mb-5">Latest bids</h2><div class="bid-row py-3 flex justify-between"><span>Amira B.</span><b class="text-luxury-sage">145,000 DZD</b></div><div class="bid-row py-3 flex justify-between"><span>Youssef K.</span><b class="text-luxury-sage">138,000 DZD</b></div><div class="bid-row py-3 flex justify-between"><span>Lina M.</span><b class="text-luxury-sage">132,000 DZD</b></div></section><section class="card rounded-2xl p-6 lg:col-span-2"><p class="eyebrow">For collectors</p><h2 class="font-serif text-3xl font-bold mt-2">How live bidding works</h2><div class="grid sm:grid-cols-3 gap-5 mt-6 text-sm"><div><i class="fa-regular fa-eye text-luxury-gold text-xl"></i><h3 class="font-bold mt-3">Watch</h3><p class="text-[#6F665C] mt-1">Follow each new bid in real time.</p></div><div><i class="fa-solid fa-gavel text-luxury-gold text-xl"></i><h3 class="font-bold mt-3">Bid</h3><p class="text-[#6F665C] mt-1">Place your offer with one clear action.</p></div><div><i class="fa-regular fa-gem text-luxury-gold text-xl"></i><h3 class="font-bold mt-3">Collect</h3><p class="text-[#6F665C] mt-1">Secure your artwork after the auction.</p></div></div></section></div>
        <section><div class="flex items-end justify-between mb-6"><div><p class="eyebrow">Coming soon</p><h2 class="font-serif text-4xl font-bold mt-2">Upcoming lots</h2></div><span class="text-luxury-sage font-bold text-sm">Curated weekly</span></div><div class="grid grid-cols-1 md:grid-cols-3 gap-7">${art.slice(1,4).map(card).join('')}</div></section>`;
      const end = Date.now() + 2 * 60 * 60 * 1000 + 45 * 60 * 1000;
      const updateTimer = () => { let n = Math.max(0, end - Date.now()); const values = [[Math.floor(n / 3600000),'Hours'], [Math.floor(n / 60000) % 60,'Minutes'], [Math.floor(n / 1000) % 60,'Seconds']]; document.getElementById('auctionTimer').innerHTML = values.map(([value,label]) => `<div class="timer-box rounded-xl px-4 py-3 text-center"><b class="text-2xl block">${String(value).padStart(2,'0')}</b><span class="text-[10px] uppercase tracking-wider text-white/60">${label}</span></div>`).join(''); };
      updateTimer(); setInterval(updateTimer, 1000);
    } else {
      const type = section === 'digital' ? 'Digital' : 'Traditional';
      content.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-7">${art.filter(a=>a[2]===type).map(card).join('')}</div>`;
    }
  </script>
</body>
</html>
